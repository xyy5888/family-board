<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="家族ボード">
<meta name="format-detection" content="telephone=no">
<title>家族ボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&family=Shippori+Mincho:wght@400;500&display=swap">
<style>
  /* ===== Tokens：車のメーターパネル風（深いネイビー + アイスブルーの発光） ===== */
  :root {
    --bg0:#040A16; --bg1:#081A36; --glow:#0F3A78;
    --panelA:rgba(40,100,180,.20); --panelB:rgba(10,32,76,.34); --line:rgba(100,178,255,.28);
    --ink:#EAF4FF; --ink-2:#8DA8C8; --ink-3:#4E6683; --cyan:#4FD1FF; --amber:#FFB547;
    --f-txt:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    --f-num:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    --f-quote:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
    --w-time:300;
  }
  /* 兼容 iOS 12 Safari：不使用 flex 的 gap / inset / aspect-ratio 等新属性 */
  html, body { height:100%; margin:0; background:var(--bg0); }
  body { overflow:hidden; color:var(--ink); font-family:var(--f-txt); font-weight:400;
         background:
           radial-gradient(1100px 700px at 12% -8%, rgba(30,100,200,.55) 0%, rgba(30,100,200,0) 62%),
           radial-gradient(900px 700px at 108% 104%, rgba(20,80,170,.50) 0%, rgba(20,80,170,0) 60%),
           linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
         -webkit-user-select:none; user-select:none; -webkit-text-size-adjust:100%; touch-action:manipulation; }

  /* 背景のメーター目盛り（装飾） */
  #bg { position:fixed; left:0; top:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  #bg svg { width:100%; height:100%; display:block; }

  #stage { position:absolute; z-index:1; left:50%; top:50%; width:1080px; height:1920px; box-sizing:border-box;
           padding:48px 68px 40px; display:flex; flex-direction:column; transform-origin:center center; }
  #dim { position:fixed; z-index:5; left:0; top:0; right:0; bottom:0; background:#000; opacity:0;
         pointer-events:none; transition:opacity 2s; }
  #dim.on { opacity:.5; }

  /* パネル：半透明の青 + 細い発光縁 + 左上のハイライト線 */
  .panel { position:relative; box-sizing:border-box; margin-top:10px; padding:10px 18px 10px;
           background:linear-gradient(180deg, var(--panelA), var(--panelB));
           border:1px solid var(--line); border-radius:18px; }
  .panel::before { content:""; position:absolute; left:20px; top:-1px; width:64px; height:2px; background:var(--cyan);
                   box-shadow:0 0 10px 1px rgba(79,209,255,.75); }
  .label { font-size:24px; letter-spacing:.3em; color:var(--ink-2); font-weight:500; margin:0 0 4px; }

  .top { display:flex; flex-direction:column; }
  .clock { display:flex; flex-direction:column; padding-bottom:4px; }
  .time { font-family:var(--f-num); font-weight:var(--w-time); font-size:250px; line-height:.9; letter-spacing:-.02em;
          font-variant-numeric:tabular-nums; margin-left:-8px; white-space:nowrap;
          text-shadow:0 0 26px rgba(79,209,255,.38), 0 0 2px rgba(180,230,255,.6); }
  .time .colon { display:inline-block; -webkit-animation:breathe 2s ease-in-out infinite; animation:breathe 2s ease-in-out infinite; }
  @-webkit-keyframes breathe { 50% { opacity:.25; } }
  @keyframes breathe { 50% { opacity:.25; } }
  .date { margin-top:10px; display:flex; align-items:baseline; font-size:72px; line-height:1.1; font-weight:400; white-space:nowrap; }
  .date .wk { color:var(--cyan); margin-left:22px; text-shadow:0 0 14px rgba(79,209,255,.5); }
  .date .greet { margin-left:auto; font-size:40px; color:var(--ink-2); font-weight:300; }
  /* 一日の経過メーター（目盛り + 発光バー） */
  .scale { position:relative; height:10px; margin-top:12px; border-radius:5px;
           background:repeating-linear-gradient(90deg, rgba(141,168,200,.55) 0, rgba(141,168,200,.55) 2px, transparent 2px, transparent 10px); }
  .scale i { position:absolute; left:0; top:0; height:10px; width:0; border-radius:5px;
             background:linear-gradient(90deg, rgba(79,209,255,.25), var(--cyan)); box-shadow:0 0 12px rgba(79,209,255,.7); }

  .wx-now { display:flex; align-items:center; }
  .wx-now svg { width:120px; height:120px; flex:none; margin-right:32px; }
  .wx-temp { font-family:var(--f-num); font-weight:var(--w-time); font-size:150px; line-height:.9; letter-spacing:-.02em;
             text-shadow:0 0 22px rgba(79,209,255,.35); }
  .wx-temp sup { font-size:.42em; vertical-align:top; position:relative; top:.1em; font-weight:300; }
  .wx-info { margin-left:auto; text-align:right; }
  .wx-info .cond { font-size:52px; }
  .wx-info .rng { margin-top:10px; font-size:38px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .wx-info .rng .pop i { font-style:normal; }

  /* 每小时天气 / 降水概率 */
  .hrs { display:grid; grid-template-columns:repeat(6,1fr); }
  .hr { display:flex; flex-direction:column; align-items:center; }
  .hr > * + * { margin-top:2px; }
  .hr .mid { display:flex; align-items:center; justify-content:center; }
  .hr .h { font-size:32px; line-height:1.2; color:var(--ink-2); font-family:var(--f-num); }
  .hr .ic svg { width:48px; height:48px; display:block; margin-right:6px; }
  .hr .t { font-family:var(--f-num); font-size:46px; font-weight:400; line-height:1.1; }
  .hr .p { font-family:var(--f-num); font-size:32px; line-height:1.2; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .hr .p.hi { color:var(--amber); }
  .hr .p svg { width:22px; height:22px; margin-right:3px; vertical-align:-2px; }
  .hr .bar { width:72%; height:6px; margin-top:4px; border-radius:3px; background:rgba(141,168,200,.22); overflow:hidden; }
  .hr .bar i { display:block; height:6px; border-radius:3px; background:var(--cyan); }
  .hr .bar.hi i { background:var(--amber); box-shadow:0 0 8px rgba(255,181,71,.8); }

  #schedule { flex:1 0 auto; }
  .ev { display:grid; grid-template-columns:170px 1fr auto; -webkit-box-align:center; align-items:center;
        min-height:62px; padding:0 12px; margin:0 -12px; border-radius:14px; }
  .ev .tm { font-family:var(--f-num); font-size:46px; font-variant-numeric:tabular-nums; margin-right:20px; }
  .ev .ti { font-size:46px; line-height:1.2; }
  .ev .who { font-size:30px; color:var(--ink-2); }
  .ev.past, .ev.past .who { color:var(--ink-3); }
  .ev.now .tm, .ev.next .tm { color:var(--cyan); }
  .ev.next { background:rgba(79,209,255,.13); box-shadow:inset 0 0 0 1px rgba(79,209,255,.40); }
  .ev .tag { white-space:nowrap; font-size:30px; color:var(--cyan); letter-spacing:.06em; }
  .empty { font-size:38px; color:var(--ink-3); padding:16px 0; }

  .duo { display:grid; grid-template-columns:1fr 1fr; grid-column-gap:10px; column-gap:10px; }
  .duo .panel { margin-top:10px; }
  .todo, .rem { list-style:none; margin:0; padding:0; }
  .todo li, .rem li { display:flex; align-items:center; min-height:54px; font-size:40px; line-height:1.2; }
  .todo li { cursor:pointer; }
  .box { width:34px; height:34px; flex:none; border-radius:50%; border:3px solid var(--ink-2); box-sizing:border-box; position:relative; margin-right:16px; }
  .todo li.done { color:var(--ink-3); text-decoration:line-through; }
  .todo li.done .box { background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px rgba(79,209,255,.7); }
  .todo li.done .box::after { content:""; position:absolute; left:9px; top:3px; width:9px; height:16px;
        border:solid var(--bg0); border-width:0 4px 4px 0; -webkit-transform:rotate(45deg); transform:rotate(45deg); }
  .rem li { justify-content:space-between; font-size:38px; }
  .rem .what { min-width:0; margin-right:12px; }
  .rem .when { flex:none; font-size:28px; color:var(--cyan); letter-spacing:.04em; }

  /* 今日の名言 */
  .quote { padding-bottom:8px; }
  .quote .q { margin:0; font-family:var(--f-quote); font-weight:500; font-size:44px; line-height:1.35; text-shadow:0 0 18px rgba(79,209,255,.22); }
  .quote .q.l { font-size:54px; } .quote .q.s { font-size:38px; }
  .quote .qc { margin:4px 0 0; font-size:26px; color:var(--ink-2); font-weight:300; }

  footer { margin-top:8px; font-size:22px; color:var(--ink-3); display:flex; justify-content:space-between; }

  /* ===== 宽屏（iPad 4:3）：天气模块放到时钟右侧 ===== */
  #stage.wide { padding:34px 52px 26px; }
  #stage.wide .top { flex-direction:row; align-items:stretch; }
  #stage.wide .time { font-size:280px; }
  #stage.wide .clock { flex:none; }
  #stage.wide .date .greet { display:none; }
  #stage.wide #weather { flex:1; min-width:0; margin-top:0; margin-left:14px; padding:8px 16px 8px; }
  #stage.wide .wx-now { flex-wrap:wrap; justify-content:flex-end; }
  #stage.wide .wx-now svg { width:60px; height:60px; margin:0 6px 0 0; }
  #stage.wide .wx-temp { font-size:118px; }
  #stage.wide .wx-info { flex-basis:100%; margin-left:0; margin-top:2px; }
  #stage.wide .wx-info .cond { font-size:38px; line-height:1.25; }
  #stage.wide .wx-info .rng { font-size:32px; margin-top:2px; line-height:1.3; }
  #stage.wide .wx-info .rng .pop { display:block; }
  #stage.wide .wx-info .rng .pop i { display:none; }
  #stage.tall #weather { margin-top:10px; }

  /* 高度不够时按顺序收起次要内容（逐级叠加） */
  #stage.s1 footer, #stage.s1 .scale { display:none; }
  #stage.s2 .todo li:nth-child(4), #stage.s2 .rem li:nth-child(4) { display:none; }
  #stage.s3 .quote .qc { display:none; }
  #stage.s4 .ev.past { display:none; }
  /* 旧 Safari(iOS 12) 高度不足时会把 flex 子元素压扁导致重叠：禁止收缩，溢出交给 fit() 检测 */
  #stage > *, .top > *, .clock > *, #weather > * { flex-shrink:0; }
</style>
</head>
<body>
<div id="bg">
  <svg viewBox="0 0 1080 1440" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#4FD1FF">
      <circle cx="1010" cy="1330" r="640" stroke-opacity=".10" stroke-width="20" stroke-dasharray="2 24"/>
      <circle cx="1010" cy="1330" r="604" stroke-opacity=".14" stroke-width="2"/>
      <circle cx="1010" cy="1330" r="520" stroke-opacity=".08" stroke-width="1.5"/>
      <circle cx="60" cy="-60" r="470" stroke-opacity=".09" stroke-width="16" stroke-dasharray="2 20"/>
      <circle cx="60" cy="-60" r="440" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="1010" cy="1330" r="640" stroke-opacity=".28" stroke-width="5" stroke-dasharray="820 3200" transform="rotate(-172 1010 1330)"/>
    </g>
  </svg>
</div>

<div id="stage">
  <div class="top">
    <div class="clock">
      <div class="time" id="time">--<span class="colon">:</span>--</div>
      <div class="date"><span id="date">-</span><span class="wk" id="wk">-</span><span class="greet" id="greet"></span></div>
      <div class="scale"><i id="dayfill"></i></div>
    </div>
    <section id="weather" class="panel">
      <h2 class="label" id="wxLabel">天気</h2>
      <div class="wx-now">
        <div id="wxIcon"></div>
        <div class="wx-temp" id="wxTemp">--<sup>°</sup></div>
        <div class="wx-info"><div class="cond" id="wxCond">-</div><div class="rng" id="wxRng">-</div></div>
      </div>
    </section>
  </div>

  <section class="hourly panel"><div class="hrs" id="hrs"></div></section>

  <section id="schedule" class="panel"><h2 class="label">今日の予定</h2><div id="events"></div></section>

  <div class="duo">
    <section class="panel"><h2 class="label">ToDo</h2><ul class="todo" id="todo"></ul></section>
    <section class="panel"><h2 class="label">家族リマインダー</h2><ul class="rem" id="rem"></ul></section>
  </div>

  <section class="quote panel"><p class="q" id="qText"></p><p class="qc" id="qCap"></p></section>

  <footer><span id="ftL">v0.6</span><span id="ftR"></span></footer>
</div>
<div id="dim"></div>

<script>
/* ============================================================
   CONFIG —— 只需要改这里
   数据优先级：Google 表格（填了链接才启用）> data.json > 内置示例
   ============================================================ */
var CONFIG = {
  city: "稲城市", lat: 35.64, lon: 139.50,   // 東京都稲城市
  font: "rounded",                          // 字体方案：rounded（默认）/ zen / mincho / noto（也可在网址后加 ?font=zen 试看）
  dataUrl: "data.json",
  sheets: { events: "", todos: "", reminders: "" },
  refreshMin: 5,
  nightFrom: 22, nightTo: 6
};

/* ---------- 字体方案 ---------- */
var FONTS = {
  rounded: { css:"M+PLUS+Rounded+1c:wght@300;400;500",   fam:'"M PLUS Rounded 1c"',   wt:300, base:true },
  zen:     { css:"Zen+Kaku+Gothic+New:wght@300;400;500", fam:'"Zen Kaku Gothic New"', wt:300 },
  mincho:  { css:"Shippori+Mincho:wght@400;500;600",     fam:'"Shippori Mincho"',     wt:400 },
  noto:    { css:"Jost:wght@200;300;400;500&family=Noto+Sans+JP:wght@300;400;500", fam:'"Noto Sans JP"', num:'"Jost"', wt:200 }
};
(function () {
  var m = location.search.match(/[?&]font=(\w+)/), key = (m && FONTS[m[1]]) ? m[1] : CONFIG.font, f = FONTS[key] || FONTS.rounded;
  if (!f.base) {
    var l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + f.css + "&display=swap"; document.head.appendChild(l);
    var tail = ',"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif', st = document.documentElement.style;
    st.setProperty("--f-txt", f.fam + tail);
    st.setProperty("--f-num", (f.num || f.fam) + tail);
    st.setProperty("--w-time", f.wt);
    if (key === "mincho") st.setProperty("--f-quote", f.fam + ',"Hiragino Mincho ProN","Yu Mincho",serif');
  }
})();

/* ---------- 今日の名言（日付から自動で1つ選ぶ。data.json の quote で上書き可） ---------- */
var QUOTES = [
  ["七転び八起き","何度失敗しても、くじけず立ち上がること"],
  ["石の上にも三年","辛抱すれば、いつか必ず報われる"],
  ["古池や蛙飛び込む水の音","松尾芭蕉"],
  ["継続は力なり","続けることが、やがて大きな力になる"],
  ["急がば回れ","急ぐときほど、確実な道を選ぶ"],
  ["雨ニモマケズ 風ニモマケズ","宮沢賢治『雨ニモマケズ』"],
  ["笑う門には福来る","いつも笑っている家には、幸せがやってくる"],
  ["一期一会","出会いは一生に一度。その時間を大切に"],
  ["菜の花や月は東に日は西に","与謝蕪村"],
  ["温故知新","古きを訪ねて、新しきを知る"],
  ["情けは人のためならず","人に親切にすれば、巡り巡って自分に返る"],
  ["春はあけぼの。やうやう白くなりゆく山ぎは","清少納言『枕草子』"],
  ["塵も積もれば山となる","小さなことも、積み重ねれば大きくなる"],
  ["千里の道も一歩から","大きな目標も、最初の一歩から始まる"],
  ["閑さや岩にしみ入る蝉の声","松尾芭蕉"],
  ["果報は寝て待て","焦らず、良い知らせを待つのがよい"],
  ["失敗は成功のもと","失敗から学べば、次の成功につながる"],
  ["天は人の上に人を造らず","福沢諭吉『学問のすゝめ』"],
  ["十人十色","考え方や好みは、人それぞれ違う"],
  ["案ずるより産むが易し","心配するより、やってみれば意外と簡単"],
  ["雀の子そこのけそこのけお馬が通る","小林一茶"],
  ["縁の下の力持ち","目立たない所で、人を支える人"],
  ["早起きは三文の徳","朝早く起きると、何かしら良いことがある"],
  ["ゆく河の流れは絶えずして","鴨長明『方丈記』"],
  ["初心忘るべからず","始めた頃の謙虚な気持ちを忘れない"],
  ["思い立ったが吉日","思いついた日が、始めるのに最良の日"],
  ["柿くへば鐘が鳴るなり法隆寺","正岡子規"],
  ["好きこそものの上手なれ","好きなことは、自然と上達する"],
  ["三人寄れば文殊の知恵","皆で考えれば、良い知恵が出る"],
  ["国境の長いトンネルを抜けると雪国であった。","川端康成『雪国』"],
  ["善は急げ","良いと思ったことは、ためらわず実行する"],
  ["百聞は一見に如かず","何度聞くより、一度見るほうが確か"],
  ["目には青葉山ほととぎす初鰹","山口素堂"],
  ["雨降って地固まる","争いのあとは、かえって関係が良くなる"],
  ["実るほど頭を垂れる稲穂かな","立派な人ほど、謙虚である"],
  ["祇園精舎の鐘の声、諸行無常の響きあり","『平家物語』"],
  ["転ばぬ先の杖","失敗しないよう、前もって用意しておく"],
  ["五月雨をあつめて早し最上川","松尾芭蕉"],
  ["鉄は熱いうちに打て","物事は、時期を逃さず行うのがよい"],
  ["芸は身を助く","身につけた技能は、いざというとき自分を助ける"],
  ["吾輩は猫である。名前はまだ無い。","夏目漱石『吾輩は猫である』"],
  ["玉磨かざれば光なし","素質があっても、努力しなければ才能は開かない"],
  ["春の海ひねもすのたりのたりかな","与謝蕪村"],
  ["塞翁が馬","幸不幸は予測できない。一喜一憂しない"],
  ["習うより慣れよ","学ぶより、実際にやって身につける"],
  ["分け入つても分け入つても青い山","種田山頭火"],
  ["以心伝心","言葉にしなくても、心が通じ合う"],
  ["棚から牡丹餅","思いがけない幸運が舞い込む"],
  ["夏草や兵どもが夢の跡","松尾芭蕉"],
  ["切磋琢磨","仲間と励まし合い、共に向上する"],
  ["石橋を叩いて渡る","用心深く確かめてから行動する"],
  ["朝顔に釣瓶とられてもらひ水","加賀千代女"],
  ["日進月歩","絶え間なく、どんどん進歩する"],
  ["腹八分目に医者いらず","食べ過ぎないことが、健康の秘訣"],
  ["荒海や佐渡によこたふ天河","松尾芭蕉"],
  ["心機一転","あることをきっかけに、気持ちを入れ替える"],
  ["山椒は小粒でもぴりりと辛い","体は小さくても、能力は優れている"],
  ["木曾路はすべて山の中である。","島崎藤村『夜明け前』"],
  ["有言実行","口にしたことは、必ず実行する"],
  ["旅に病んで夢は枯野をかけ廻る","松尾芭蕉"],
  ["花鳥風月","自然の美しい風物を味わう心"],
  ["メロスは激怒した。","太宰治『走れメロス』"],
  ["不撓不屈","困難にくじけず、意志を貫く"],
  ["名月をとってくれろと泣く子かな","小林一茶"],
  ["捲土重来","一度敗れても、勢いを盛り返して再び挑む"],
  ["春眠暁を覚えず","春は心地よくて、夜明けにも気づかず眠ってしまう"],
  ["花の雲鐘は上野か浅草か","松尾芭蕉"]
];

/* 内置示例 */
var state = {
  events: [
    { s:"09:30", e:"10:30", title:"ヨガ教室", who:"ママ" },
    { s:"11:00", e:"12:00", title:"スイミング", who:"子ども" },
    { s:"14:00", e:"15:00", title:"宅配便の受取", who:"家族" },
    { s:"18:30", e:"20:00", title:"家族の夕食", who:"家族" }
  ],
  todos: [ {t:"牛乳と卵を買う"}, {t:"歯医者の予約"}, {t:"植物に水やり"}, {t:"段ボールを片付ける"} ],
  reminders: [
    { d:"明日", what:"可燃ごみの日" }, { d:"月曜", what:"敬老の日・電話する" },
    { d:"9/25", what:"光熱費の支払期限" }, { d:"9/30", what:"健診結果の受取" }
  ],
  quote: null, src: "サンプルデータ", updated: ""
};

/* ---------- 工具 ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function toMin(hhmm) { var p = String(hhmm).split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
function fmtMin(m) { return pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60); }
var WK = ["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
var WKS = ["日曜","月曜","火曜","水曜","木曜","金曜","土曜"];
function todayStr() { var n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()); }
function parseDate(s) {
  var m = String(s || "").trim().match(/^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})$/);
  if (!m) return null;
  return new Date(m[1] ? +m[1] : new Date().getFullYear(), +m[2] - 1, +m[3]);
}
function dayDiff(d) { var n = new Date(); var t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()); return Math.round((d - t0) / 864e5); }

/* 宽屏时：若元素内容宽度超过 max，按比例缩小字号（el.style.fontSize），否则恢复默认 */
function shrinkTo(el, base, max) {
  if (el.className.indexOf("date") < 0 && el.id !== "time") return;
  el.style.fontSize = "";
  if (stage.className.indexOf("wide") < 0) return;
  var w = el.id === "time" ? el.scrollWidth : $("date").offsetWidth + $("wk").offsetWidth + 22;
  if (w > max) el.style.fontSize = Math.floor(base * max / w) + "px";
}

/* ---------- 舞台：宽度固定 1080、铺满屏幕宽度，高度随屏幕比例变化 ---------- */
var stage = $("stage");
function fit() {
  var s = innerWidth / 1080, H = innerHeight / s;
  if (H < 1300) { H = 1300; s = Math.min(s, innerHeight / 1300); }
  stage.style.height = H + "px";
  var v = "translate(-50%,-50%) scale(" + s + ")";
  stage.style.webkitTransform = v; stage.style.transform = v;
  var mode = H >= 1780 ? "tall" : "wide", lv = ["", "s1", "s2", "s3", "s4"];
  stage.className = mode;
  shrinkTo($("time"), 280, 640); shrinkTo($("date").parentNode, 72, 640);      // 时钟/日期太宽时自动缩小，给右侧天气留位置
  for (var i = 0; i < lv.length; i++) {          // 放不下就依次收起：页脚 → 第4条待办 → 名言出处 → 已过日程
    stage.className = mode + (i ? " " + lv.slice(1, i + 1).join(" ") : "");
    if (stage.scrollHeight <= H + 1) break;
  }
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); addEventListener("load", fit); fit();
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); } catch (e) {}
setTimeout(fit, 1500); setTimeout(fit, 4000);   // 网络字体晚到时重新排版

/* ---------- 天气图标 ---------- */
var P = {
  sun:  '<circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16.5 16.5l4.2 4.2M43.3 43.3l4.2 4.2M16.5 47.5l4.2-4.2M43.3 20.7l4.2-4.2"/>',
  cloud:'<path d="M18 46h27a9 9 0 0 0 1.5-17.9A14 14 0 0 0 19.3 30 8 8 0 0 0 18 46z"/>',
  part: '<circle cx="24" cy="22" r="7"/><path d="M24 8v3M10 22h3M14 12l2 2M34 12l-2 2"/><path d="M22 50h24a8 8 0 0 0 1.3-15.9A12 12 0 0 0 25 37a6.5 6.5 0 0 0-3 13z"/>',
  rain: '<path d="M18 38h27a9 9 0 0 0 1.5-17.9A14 14 0 0 0 19.3 22 8 8 0 0 0 18 38z"/><path d="M23 45l-3 8M33 45l-3 8M43 45l-3 8"/>',
  thun: '<path d="M18 36h27a9 9 0 0 0 1.5-17.9A14 14 0 0 0 19.3 20 8 8 0 0 0 18 36z"/><path d="M34 38l-6 9h7l-5 9"/>',
  snow: '<path d="M18 36h27a9 9 0 0 0 1.5-17.9A14 14 0 0 0 19.3 20 8 8 0 0 0 18 36z"/><path d="M24 45v.1M34 45v.1M44 45v.1M29 53v.1M39 53v.1"/>'
};
function icon(k) { return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">' + P[k] + '</svg>'; }
var DROP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3c3 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-6.5 6-11z"/></svg>';
function wmo(c) {
  if (c === 0) return ["sun","晴れ"];
  if (c <= 2) return ["part","晴れ時々くもり"];
  if (c === 3) return ["cloud","くもり"];
  if (c <= 48) return ["cloud","霧"];
  if (c <= 67 || (c >= 80 && c <= 82)) return ["rain","雨"];
  if (c <= 77 || c === 85 || c === 86) return ["snow","雪"];
  return ["thun","雷雨"];
}

/* ---------- 天气（Open-Meteo，稲城市の座標。失敗時はサンプル表示） ---------- */
var weather = { live:false, temp:26, code:2, hi:29, lo:21, pop:60,
  hours:[[0,26,2,10],[1,27,2,10],[2,28,0,20],[3,28,3,40],[4,27,61,60],[5,25,61,70]] };   // [何時間後, 気温, コード, 降水確率]
function loadWeather() {
  var u = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.lat + "&longitude=" + CONFIG.lon +
    "&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=2";
  return fetch(u).then(function (r) { return r.json(); }).then(function (j) {
    var i = new Date().getHours();
    weather = { live:true, temp:Math.round(j.current.temperature_2m), code:j.current.weather_code,
      hi:Math.round(j.daily.temperature_2m_max[0]), lo:Math.round(j.daily.temperature_2m_min[0]),
      pop:j.daily.precipitation_probability_max[0],
      hours:[0,1,2,3,4,5].map(function (d) { return [d, Math.round(j.hourly.temperature_2m[i + d]), j.hourly.weather_code[i + d], j.hourly.precipitation_probability[i + d]]; }) };
  }).catch(function () {}).then(function () { renderWeather(); renderFooter(); fit(); });
}
function renderWeather() {
  var w = wmo(weather.code), h0 = new Date().getHours();
  $("wxLabel").textContent = "天気 · " + CONFIG.city;
  $("wxIcon").innerHTML = icon(w[0]);
  $("wxTemp").innerHTML = weather.temp + "<sup>°</sup>";
  $("wxCond").textContent = w[1];
  $("wxRng").innerHTML = weather.hi + "° / " + weather.lo + "°<span class=\"pop\"><i>  ·  </i>降水 " + weather.pop + "%</span>";
  $("hrs").innerHTML = weather.hours.map(function (x) {
    var hi = x[3] >= 50;
    return '<div class="hr"><span class="h">' + (x[0] === 0 ? "現在" : pad((h0 + x[0]) % 24) + "時") + '</span><span class="mid"><span class="ic">' + icon(wmo(x[2])[0]) +
           '</span><span class="t">' + x[1] + '°</span></span><span class="p' + (hi ? " hi" : "") + '">' + DROP + x[3] + '%</span>' +
           '<span class="bar' + (hi ? " hi" : "") + '"><i style="width:' + Math.max(4, x[3]) + '%"></i></span></div>';
  }).join("");
}

/* ---------- 今日の名言 ---------- */
function renderQuote() {
  var d = new Date(), n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  var q = state.quote || QUOTES[n % QUOTES.length], len = q[0].length;
  $("qText").className = "q" + (len <= 12 ? " l" : len > 20 ? " s" : "");
  $("qText").textContent = q[0];
  $("qCap").textContent = q[1];
}

/* ---------- 日程 ---------- */
function todaysEvents() {
  return state.events.filter(function (e) {
    if (!e.date) return true;
    var d = parseDate(e.date); return d && dayDiff(d) === 0;
  }).map(function (e) {
    var s = toMin(e.s), en = e.e ? toMin(e.e) : s + 60;
    return { s:s, e:en, title:e.title, who:e.who || "" };
  }).sort(function (a, b) { return a.s - b.s; });
}
function renderEvents() {
  var n = new Date(), now = n.getHours() * 60 + n.getMinutes();
  var all = todaysEvents(), MAX = 4;
  var upcoming = all.filter(function (e) { return e.e > now; });
  var past = all.filter(function (e) { return e.e <= now; });
  var show = upcoming.slice(0, MAX);
  if (show.length < MAX) show = past.slice(-(MAX - show.length)).concat(show);
  if (!show.length) { $("events").innerHTML = '<div class="empty">今日は予定がありません。ゆっくり休みましょう</div>'; return; }
  var nextS = null;
  for (var k = 0; k < all.length; k++) if (all[k].s > now) { nextS = all[k]; break; }
  $("events").innerHTML = show.map(function (e) {
    var isPast = e.e <= now, cur = e.s <= now && now < e.e, isNext = nextS === e;
    var cls = isPast ? "past" : cur ? "now" : isNext ? "next" : "", tag = "";
    if (cur) tag = '<span class="tag">進行中</span>';
    else if (isNext) { var d = e.s - now; tag = '<span class="tag">あと' + (d >= 60 ? Math.floor(d / 60) + "時間" + (d % 60 ? d % 60 + "分" : "") : d + "分") + '</span>'; }
    return '<div class="ev ' + cls + '"><span class="tm">' + fmtMin(e.s) + '</span><span class="ti">' + e.title +
           (e.who ? ' <span class="who">' + e.who + '</span>' : '') + '</span>' + (tag || "<span></span>") + '</div>';
  }).join("");
}

/* ---------- ToDo（タップで完了。この iPad にだけ保存） ---------- */
var KEY = "family-board-done", doneMap = {};
try { doneMap = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
function renderTodo() {
  var items = state.todos.slice(0, 4);
  $("todo").innerHTML = items.length ? items.map(function (x, i) {
    var dn = x.done || doneMap[x.t];
    return '<li class="' + (dn ? "done" : "") + '" data-i="' + i + '"><span class="box"></span><span>' + x.t + '</span></li>';
  }).join("") : '<li style="color:var(--ink-3)">ToDoはありません</li>';
}
$("todo").addEventListener("click", function (ev) {
  var li = ev.target; while (li && li.tagName !== "LI") li = li.parentNode;
  if (!li || li.getAttribute("data-i") === null) return;
  var x = state.todos[+li.getAttribute("data-i")]; if (!x) return;
  doneMap[x.t] = !(x.done || doneMap[x.t]); x.done = false;
  try { localStorage.setItem(KEY, JSON.stringify(doneMap)); } catch (e) {}
  renderTodo();
});

/* ---------- 家族リマインダー：日付は 今日/明日/曜日/M/D に自動変換、過ぎたものは非表示 ---------- */
function whenLabel(x) {
  var d = parseDate(x.d); if (!d) return { text:x.d, key:-1, keep:true };
  var diff = dayDiff(d);
  return { text: diff === 0 ? "今日" : diff === 1 ? "明日" : (diff > 1 && diff < 7) ? WKS[d.getDay()] : (d.getMonth() + 1) + "/" + d.getDate(),
           key: diff, keep: diff >= 0 };
}
function renderRem() {
  var rows = state.reminders.map(function (x) { var w = whenLabel(x); return { w:w, what:x.what }; })
    .filter(function (r) { return r.w.keep; }).sort(function (a, b) { return a.w.key - b.w.key; }).slice(0, 4);
  $("rem").innerHTML = rows.length ? rows.map(function (r) {
    return '<li><span class="what">' + r.what + '</span><span class="when">' + r.w.text + '</span></li>';
  }).join("") : '<li style="color:var(--ink-3)">リマインダーはありません</li>';
}

/* ---------- データ読み込み：data.json と Google スプレッドシート ---------- */
function parseCSV(t) {
  var rows = [], row = [], f = "", q = false, i, c;
  for (i = 0; i < t.length; i++) {
    c = t.charAt(i);
    if (q) { if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t.charAt(i + 1) === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.slice(1).filter(function (r) { return r.some(function (x) { return x.trim(); }); });
}
function getText(url) {
  return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.text(); });
}
function loadData() {
  var srcs = [];
  var p = getText(CONFIG.dataUrl).then(function (t) {
    var d = JSON.parse(t);
    if (d.events) state.events = d.events;
    if (d.todos) state.todos = d.todos.map(function (x) { return typeof x === "string" ? { t:x } : x; });
    if (d.reminders) state.reminders = d.reminders.map(function (x) { return { d:x.when || x.d, what:x.what }; });
    state.quote = (d.quote && d.quote.t && d.quoteDate === todayStr()) ? [d.quote.t, d.quote.c || ""] : null;
    srcs.push("data.json");
  }).catch(function () {});
  var S = CONFIG.sheets;
  if (S.events) p = p.then(function () { return getText(S.events).then(function (t) {
    state.events = parseCSV(t).map(function (r) { return { date:r[0], s:r[1], e:r[2], title:r[3], who:r[4] }; }).filter(function (e) { return e.s && e.title; });
    srcs.push("シート·予定"); }).catch(function () {}); });
  if (S.todos) p = p.then(function () { return getText(S.todos).then(function (t) {
    state.todos = parseCSV(t).map(function (r) { return { t:r[0], done:/^(y|yes|1|是|完成|完了|済|✓|true)$/i.test((r[1] || "").trim()) }; }).filter(function (x) { return x.t; });
    srcs.push("シート·ToDo"); }).catch(function () {}); });
  if (S.reminders) p = p.then(function () { return getText(S.reminders).then(function (t) {
    state.reminders = parseCSV(t).map(function (r) { return { d:r[0], what:r[1] }; }).filter(function (x) { return x.what; });
    srcs.push("シート·リマインダー"); }).catch(function () {}); });
  return p.then(function () {
    if (srcs.length) { state.src = srcs.join(" / "); var n = new Date(); state.updated = pad(n.getHours()) + ":" + pad(n.getMinutes()); }
    renderEvents(); renderTodo(); renderRem(); renderQuote(); renderFooter(); fit();
  });
}
function renderFooter() {
  $("ftL").textContent = CONFIG.city + " · 天気" + (weather.live ? "ライブ" : "サンプル") + " · v0.6";
  $("ftR").textContent = state.updated ? "データ " + state.updated + " 更新 · " + state.src : state.src;
}

/* ---------- 時計 / 日付 / 一日メーター / 夜間減光 / 毎日3時に再読込 ---------- */
function tick() {
  var n = new Date(), h = n.getHours();
  $("time").innerHTML = pad(h) + '<span class="colon">:</span>' + pad(n.getMinutes());
  $("date").textContent = (n.getMonth() + 1) + "月" + n.getDate() + "日";
  $("wk").textContent = WK[n.getDay()];
  $("greet").textContent = h < 5 ? "夜更けです" : h < 11 ? "おはよう" : h < 18 ? "こんにちは" : "こんばんは";
  $("dayfill").style.width = ((h * 60 + n.getMinutes()) / 14.4).toFixed(1) + "%";
  var night = h >= CONFIG.nightFrom || h < CONFIG.nightTo;
  $("dim").className = night ? "on" : "";
  if (h === 3 && n.getMinutes() === 0 && n.getSeconds() < 2) location.reload();
}

tick(); renderWeather(); renderEvents(); renderTodo(); renderRem(); renderQuote(); renderFooter();
loadData(); loadWeather();
setInterval(tick, 1000);
setInterval(function () { renderEvents(); renderRem(); renderQuote(); renderWeather(); fit(); }, 60000);
setInterval(loadData, CONFIG.refreshMin * 60000);
setInterval(loadWeather, 30 * 60000);

try { addEventListener("click", function () { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); }); } catch (e) {}
</script>
