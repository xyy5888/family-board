<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="家族ボード">
<meta name="format-detection" content="telephone=no">
<title>家族ボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&family=Shippori+Mincho:wght@400;500&display=swap">
<style>
  /* ===== Tokens：車のメーターパネル風（深いネイビー + アイスブルーの発光） ===== */
  :root {
    /* --- 既定 = blue（冷光・計器ブルー）。他のテンプレートは下の html[data-theme=...] で上書き --- */
    --bg0:#040A16; --bg1:#081A36; --glow1:30,100,200; --glow2:20,80,170;
    --panelA:rgba(40,100,180,.20); --panelB:rgba(10,32,76,.34); --line:rgba(100,178,255,.28);
    --ink:#F7FBFF; --ink-2:#BCD0E8; --ink-3:#8299B8;
    --acc:#5CD8FF; --acc-rgb:92,216,255; --warn:#FFC062; --warn-rgb:255,192,98; --mute-rgb:141,168,200; --hi-rgb:180,230,255;
    --cyan:var(--acc); --amber:var(--warn);
    --f-txt:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    --f-num:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    --f-quote:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
    --f-time:var(--f-num);
    --w-time:400; --radius:18px; --gap-duo:10px;
  }
  /* 兼容 iOS 12 Safari：不使用 flex 的 gap / inset / aspect-ratio 等新属性 */
  html, body { height:100%; margin:0; background:var(--bg0); }
  body { overflow:hidden; color:var(--ink); font-family:var(--f-txt); font-weight:500;
         background:
           radial-gradient(1100px 700px at 12% -8%, rgba(var(--glow1),.55) 0%, rgba(var(--glow1),0) 62%),
           radial-gradient(900px 700px at 108% 104%, rgba(var(--glow2),.50) 0%, rgba(var(--glow2),0) 60%),
           linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
         -webkit-user-select:none; user-select:none; -webkit-text-size-adjust:100%; touch-action:manipulation; }

  /* 背景のメーター目盛り（装飾） */
  #bg { position:fixed; left:0; top:0; width:100%; height:100%; z-index:0; pointer-events:none; color:var(--acc); }
  #bg svg { width:100%; height:100%; display:block; }

  #stage { position:absolute; z-index:1; left:50%; top:50%; width:1080px; height:1920px; box-sizing:border-box;
           padding:48px 30px 40px; display:flex; flex-direction:column; transform-origin:center center; }
  #dim { position:fixed; z-index:5; left:0; top:0; right:0; bottom:0; background:#000; opacity:0;
         pointer-events:none; transition:opacity 2s; }
  #dim.on { opacity:.22; }      /* 夜間の減光（0.22 = 22% 暗く。もっと暗くしたいときは数字を大きく） */

  /* パネル：半透明の青 + 細い発光縁 + 左上のハイライト線 */
  .panel { position:relative; box-sizing:border-box; margin-top:10px; padding:10px 18px 10px;
           background:linear-gradient(180deg, var(--panelA), var(--panelB));
           border:1px solid var(--line); border-radius:var(--radius); }
  .panel::before { content:""; position:absolute; left:20px; top:-1px; width:64px; height:2px; background:var(--cyan);
                   box-shadow:0 0 10px 1px rgba(var(--acc-rgb),.75); }
  .label { font-size:24px; letter-spacing:.3em; color:var(--ink-2); font-weight:500; margin:0 0 4px; }

  .top { display:flex; flex-direction:column; }
  .clock { display:flex; flex-direction:column; padding-bottom:4px; }
  .time { font-family:var(--f-time); font-weight:var(--w-time); font-size:250px; line-height:.9; letter-spacing:-.02em;
          font-variant-numeric:tabular-nums; margin-left:-8px; white-space:nowrap;
          text-shadow:0 0 26px rgba(var(--acc-rgb),.38), 0 0 2px rgba(var(--hi-rgb),.6); }
  .time .colon { display:inline-block; -webkit-animation:breathe 2s ease-in-out infinite; animation:breathe 2s ease-in-out infinite; }
  @-webkit-keyframes breathe { 50% { opacity:.25; } }
  @keyframes breathe { 50% { opacity:.25; } }
  .date { margin-top:10px; display:flex; align-items:baseline; font-size:72px; line-height:1.1; font-weight:500; white-space:nowrap; }
  .date .wk { color:var(--cyan); margin-left:22px; text-shadow:0 0 14px rgba(var(--acc-rgb),.5); }
  .date .hn { margin-left:24px; font-size:44px; font-weight:500; }
  .date.hol #date, .date.hol .wk, .date.hol .hn { color:#FF5B5B; text-shadow:0 0 16px rgba(255,80,80,.55); }   /* 祝日は赤 */
  .date.hol .greet { display:none; }
  .date .greet { margin-left:auto; font-size:40px; color:var(--ink-2); font-weight:400; }
  /* 一日の経過メーター（目盛り + 発光バー） */
  .scale { position:relative; height:10px; margin-top:12px; border-radius:5px;
           background:repeating-linear-gradient(90deg, rgba(var(--mute-rgb),.55) 0, rgba(var(--mute-rgb),.55) 2px, transparent 2px, transparent 10px); }
  .scale i { position:absolute; left:0; top:0; height:10px; width:0; border-radius:5px;
             background:linear-gradient(90deg, rgba(var(--acc-rgb),.25), var(--cyan)); box-shadow:0 0 12px rgba(var(--acc-rgb),.7); }

  .wx-now { display:flex; align-items:center; }
  .wx-now svg { width:120px; height:120px; flex:none; margin-right:32px; }
  .wx-temp { font-family:var(--f-time); font-weight:var(--w-time); font-size:150px; line-height:.9; letter-spacing:-.02em;
             text-shadow:0 0 22px rgba(var(--acc-rgb),.35); }
  .wx-temp sup { font-size:.42em; vertical-align:top; position:relative; top:.1em; font-weight:300; }
  .wx-info { margin-left:auto; text-align:right; }
  .wx-info .cond { font-size:52px; }
  .wx-info .rng { margin-top:10px; font-size:38px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .wx-info .rng .pop i { font-style:normal; }

  /* 每小时天气 / 降水概率 */
  .hrs { display:flex; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; -ms-overflow-style:none; }
  .hrs::-webkit-scrollbar { display:none; height:0; }
  .hr { flex:0 0 16.6667%; box-sizing:border-box; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; }
  .hr.day { border-left:1px solid var(--line); }
  .hr .h.nx { color:var(--cyan); }
  .hscroll { position:relative; height:4px; margin-top:8px; border-radius:2px; background:rgba(var(--mute-rgb),.22); }
  .hscroll i { position:absolute; left:0; top:0; width:25%; height:4px; border-radius:2px; background:var(--cyan); box-shadow:0 0 8px rgba(var(--acc-rgb),.7); }
  .hr > * + * { margin-top:2px; }
  .hr .mid { display:flex; align-items:center; justify-content:center; }
  .hr .h { font-size:32px; line-height:1.2; color:var(--ink-2); font-family:var(--f-num); }
  .hr .ic svg { width:48px; height:48px; display:block; margin-right:6px; }
  .hr .t { font-family:var(--f-num); font-size:46px; font-weight:500; line-height:1.1; }
  .hr .p { font-family:var(--f-num); font-size:32px; line-height:1.2; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .hr .p.hi { color:var(--amber); }
  .hr .p svg { width:22px; height:22px; margin-right:3px; vertical-align:-2px; }
  .hr .bar { width:72%; height:6px; margin-top:4px; border-radius:3px; background:rgba(var(--mute-rgb),.22); overflow:hidden; }
  .hr .bar i { display:block; height:6px; border-radius:3px; background:var(--cyan); }
  .hr .bar.hi i { background:var(--amber); box-shadow:0 0 8px rgba(var(--warn-rgb),.8); }

  #schedule { flex:1 0 auto; }
  .ev { display:grid; grid-template-columns:170px 1fr auto; -webkit-box-align:center; align-items:center;
        min-height:62px; padding:0 12px; margin:0 -12px; border-radius:14px; }
  .ev .tm { font-family:var(--f-num); font-size:46px; font-variant-numeric:tabular-nums; margin-right:20px; }
  .ev .ti { font-size:46px; line-height:1.2; }
  .ev .who { font-size:30px; color:var(--ink-2); }
  .ev.past, .ev.past .who { color:var(--ink-3); }
  .ev.now .tm, .ev.next .tm { color:var(--cyan); }
  .ev.next { background:rgba(var(--acc-rgb),.13); box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.40); }
  .ev .tag { white-space:nowrap; font-size:30px; color:var(--cyan); letter-spacing:.06em; }
  .empty { font-size:38px; color:var(--ink-3); padding:16px 0; }

  .duo { display:grid; grid-template-columns:1fr 1fr; grid-column-gap:var(--gap-duo); column-gap:var(--gap-duo); }
  .duo .panel { margin-top:10px; }
  .todo, .rem { list-style:none; margin:0; padding:0; }
  .todo li, .rem li { display:flex; align-items:center; min-height:54px; font-size:40px; line-height:1.2; }
  .todo li { cursor:pointer; }
  .box { width:34px; height:34px; flex:none; border-radius:50%; border:3px solid var(--ink-2); box-sizing:border-box; position:relative; margin-right:16px; }
  .todo li.done { color:var(--ink-3); text-decoration:line-through; }
  .todo li.done .box { background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px rgba(var(--acc-rgb),.7); }
  .todo li.done .box::after { content:""; position:absolute; left:9px; top:3px; width:9px; height:16px;
        border:solid var(--bg0); border-width:0 4px 4px 0; -webkit-transform:rotate(45deg); transform:rotate(45deg); }
  .rem li { justify-content:space-between; font-size:38px; }
  .rem .what { min-width:0; margin-right:12px; }
  .rem .when { flex:none; font-size:28px; color:var(--cyan); letter-spacing:.04em; }

  /* 今日の名言 */
  .quote { padding-bottom:8px; }
  .quote .q { margin:0; font-family:var(--f-quote); font-weight:500; font-size:44px; line-height:1.35; text-shadow:0 0 18px rgba(var(--acc-rgb),.22); }
  .quote .q.l { font-size:54px; } .quote .q.s { font-size:38px; }
  .quote .qc { margin:4px 0 0; font-size:26px; color:var(--ink-2); font-weight:400; }

  footer { display:none; margin-top:8px; font-size:22px; color:var(--ink-3); justify-content:space-between; }
  #stage.info footer { display:flex; }        /* 日付を3回タップ（または URL に ?info）で表示 */

  /* ===== 宽屏（iPad 4:3）：天气模块放到时钟右侧 ===== */
  #stage.wide { padding:30px 22px 24px; }
  #stage.wide .top { flex-direction:row; align-items:stretch; }
  #stage.wide .time { font-size:280px; }
  #stage.wide .clock { flex:none; }
  #stage.wide .date .greet { display:none; }
  #stage.wide #weather { flex:1; min-width:0; margin-top:0; margin-left:14px; padding:8px 16px 8px; }
  #stage.wide .wx-now { flex-wrap:wrap; justify-content:flex-end; }
  #stage.wide .wx-now svg { width:60px; height:60px; margin:0 6px 0 0; }
  #stage.wide .wx-temp { font-size:118px; }
  #stage.wide .wx-info { flex-basis:100%; margin-left:0; margin-top:2px; }
  #stage.wide .wx-info .cond { font-size:38px; line-height:1.25; }
  #stage.wide .wx-info .rng { font-size:32px; margin-top:2px; line-height:1.3; }
  #stage.wide .wx-info .rng .pop { display:block; }
  #stage.wide .wx-info .rng .pop i { display:none; }
  #stage.tall #weather { margin-top:10px; }

  /* 高度不够时按顺序收起次要内容（逐级叠加） */
  #stage.s1 footer, #stage.s1 .scale { display:none; }
  #stage.s2 .todo li:nth-child(4), #stage.s2 .rem li:nth-child(4) { display:none; }
  #stage.s3 .quote .qc { display:none; }
  #stage.s4 .ev.past { display:none; }
  #stage.s5 .quote { display:none; }
  #stage.s6 .ev { min-height:50px; }
  #stage.s6 .todo li, #stage.s6 .rem li { min-height:44px; }
  #stage.s6 .hr .bar, #stage.s6 .hscroll { display:none; }
  /* 旧 Safari(iOS 12) 高度不足时会把 flex 子元素压扁导致重叠：禁止收缩，溢出交给 fit() 检测 */
  #stage > *, .top > *, .clock > *, #weather > * { flex-shrink:0; }

  /* ===== テンプレート（配色・質感）：blue=冷光 / amber=暖光 / gold=シャンパンゴールド ===== */
  html[data-theme="amber"] {
    --bg0:#0B0604; --bg1:#1C0F07; --glow1:205,88,20; --glow2:150,55,10;
    --panelA:rgba(200,100,30,.18); --panelB:rgba(70,28,8,.42); --line:rgba(255,170,80,.36);
    --ink:#FFF7EC; --ink-2:#EBD3B6; --ink-3:#B39A7E;
    --acc:#FFA53A; --acc-rgb:255,165,58; --warn:#7FDBFF; --warn-rgb:127,219,255; --mute-rgb:230,190,150; --hi-rgb:255,220,170;
    --radius:6px; --w-time:500;
  }
  html[data-theme="amber"] .panel::after { content:""; position:absolute; right:20px; bottom:-1px; width:64px; height:2px; background:var(--acc);
                                           box-shadow:0 0 10px 1px rgba(var(--acc-rgb),.75); }
  html[data-theme="amber"] .ev.next { border-radius:4px; }

  html[data-theme="gold"] {
    --bg0:#060606; --bg1:#13110E; --glow1:98,74,34; --glow2:56,40,18;
    --panelA:rgba(0,0,0,0); --panelB:rgba(0,0,0,0); --line:rgba(233,200,127,.42);
    --ink:#FBF7EE; --ink-2:#D6C8A8; --ink-3:#9A8D71;
    --acc:#E9C87F; --acc-rgb:233,200,127; --warn:#9FDDF2; --warn-rgb:159,221,242; --mute-rgb:200,185,150; --hi-rgb:255,240,200;
    --radius:0px; --gap-duo:36px; --w-time:500;
    --f-time:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  }
  html[data-theme="gold"] .panel { background:none; border:none; border-top:1px solid var(--line); border-radius:0; padding-top:14px; }
  html[data-theme="gold"] .panel::before { left:0; top:-1px; width:88px; height:3px; box-shadow:none; }
  html[data-theme="gold"] #weather.panel { border-top:none; border-left:1px solid var(--line); padding-left:22px; }
  html[data-theme="gold"] #weather.panel::before { display:none; }
  html[data-theme="gold"] .time, html[data-theme="gold"] .wx-temp {
    background:linear-gradient(180deg, #FFF4D6 0%, #E9C87F 52%, #B48A3F 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none; }
  html[data-theme="gold"] .ev.next { border-radius:2px; }
  html[data-theme="gold"] .time { margin-left:0; padding:.05em .07em .03em .06em; line-height:.95; }   /* 金色グラデ文字は要素外にはみ出た部分が切れるため余白を確保 */
  html[data-theme="gold"] .time .colon { display:inline; -webkit-animation:none; animation:none; }   /* 透明度アニメがあると背景クリップ文字で冒号が左に二重描画される */
  html[data-theme="gold"] .time .colon.off { visibility:hidden; }   /* 代わりに毎秒 tick() で class を切り替えて点滅させる */
  html[data-theme="gold"] #bg { opacity:.55; }
  #toast { position:absolute; z-index:6; left:50%; bottom:70px; -webkit-transform:translateX(-50%); transform:translateX(-50%);
           padding:16px 34px; font-size:32px; white-space:nowrap; color:var(--ink); background:rgba(0,0,0,.85);
           border:1px solid var(--line); border-radius:40px; opacity:0; pointer-events:none; transition:opacity .4s; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<div id="bg">
  <svg viewBox="0 0 1080 1440" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="currentColor">
      <circle cx="1010" cy="1330" r="640" stroke-opacity=".10" stroke-width="20" stroke-dasharray="2 24"/>
      <circle cx="1010" cy="1330" r="604" stroke-opacity=".14" stroke-width="2"/>
      <circle cx="1010" cy="1330" r="520" stroke-opacity=".08" stroke-width="1.5"/>
      <circle cx="60" cy="-60" r="470" stroke-opacity=".09" stroke-width="16" stroke-dasharray="2 20"/>
      <circle cx="60" cy="-60" r="440" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="1010" cy="1330" r="640" stroke-opacity=".28" stroke-width="5" stroke-dasharray="820 3200" transform="rotate(-172 1010 1330)"/>
    </g>
  </svg>
</div>

<div id="stage">
  <div id="toast"></div>
  <div class="top">
    <div class="clock">
      <div class="time" id="time">--<span class="colon">:</span>--</div>
      <div class="date"><span id="date">-</span><span class="wk" id="wk">-</span><span class="hn" id="hn"></span><span class="greet" id="greet"></span></div>
      <div class="scale"><i id="dayfill"></i></div>
    </div>
    <section id="weather" class="panel">
      <h2 class="label" id="wxLabel">天気</h2>
      <div class="wx-now">
        <div id="wxIcon"></div>
        <div class="wx-temp" id="wxTemp">--<sup>°</sup></div>
        <div class="wx-info"><div class="cond" id="wxCond">-</div><div class="rng" id="wxRng">-</div></div>
      </div>
    </section>
  </div>

  <section class="hourly panel"><div class="hrs" id="hrs"></div><div class="hscroll"><i id="hthumb"></i></div></section>

  <section id="schedule" class="panel"><h2 class="label">今日の予定</h2><div id="events"></div></section>

  <div class="duo">
    <section class="panel"><h2 class="label">ToDo</h2><ul class="todo" id="todo"></ul></section>
    <section class="panel"><h2 class="label">家族リマインダー</h2><ul class="rem" id="rem"></ul></section>
  </div>

  <section class="quote panel"><p class="q" id="qText"></p><p class="qc" id="qCap"></p></section>

  <footer><span id="ftL">v0.7.1</span><span id="ftR"></span></footer>
</div>
<div id="dim"></div>

<script>
/* ============================================================
   CONFIG —— 只需要改这里
   数据优先级：Google 表格（填了链接才启用）> data.json > 内置示例
   ============================================================ */
var APP_VERSION = "0.7.1";     // data.json の appVersion がこれと違えば、ページを自動で読み直す（iPad のキャッシュ対策）
var CONFIG = {
  city: "稲城市", lat: 35.64, lon: 139.50,   // 東京都稲城市
  font: "rounded",                          // 字体方案：rounded（默认）/ zen / mincho / noto（也可在网址后加 ?font=zen 试看）
  theme: "auto",                            // テンプレート：auto（6-18時=gold / 18-6時=blue）/ blue（冷光）/ amber（暖光）/ gold（シャンパンゴールド）。data.json の "theme" でも指定可
  dataUrl: "data.json",
  sheets: { events: "", todos: "", reminders: "" },   // 実際の URL は data.json の "sheets" に書く
  refreshMin: 5,
  nightFrom: 22, nightTo: 6
};

/* ---------- テンプレート選択：URL(?theme=) > この iPad で切替えた値 > data.json > CONFIG ---------- */
var THEMES = ["blue", "amber", "gold"], MODES = ["auto", "blue", "amber", "gold"], dataTheme = null, themeOverride = null, showInfo = /[?&]info\b/.test(location.search);
var THEME_KEY = "family-board-theme2", MODE_NAME = { auto: "自動（昼＝シャンパンゴールド ／ 夜＝ブルー）", blue: "ブルー（冷光）", amber: "アンバー（暖光）", gold: "シャンパンゴールド（暖光）" };
function autoTheme() { var h = new Date().getHours(); return h >= 6 && h < 18 ? "gold" : "blue"; }     // 6:00-18:00 香槟金 / 18:00-6:00 仪表蓝
function chosenMode() {
  var m = location.search.match(/[?&]theme=(\w+)/), t = themeOverride || (m ? m[1] : null);
  if (!t) { try { t = localStorage.getItem(THEME_KEY); } catch (e) {} }
  if (!t) t = dataTheme || CONFIG.theme;
  return MODES.indexOf(t) >= 0 ? t : "auto";
}
function chosenTheme() { var m = chosenMode(); return m === "auto" ? autoTheme() : m; }
function applyTheme() { document.documentElement.setAttribute("data-theme", chosenTheme()); }
var toastT = 0;
function toast(msg) {
  var el = document.getElementById("toast"); if (!el) return;
  el.textContent = msg; el.className = "on"; clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = ""; }, 2200);
}
function cycleTheme() {                           // 時計を3回タップ：自動 → ブルー → アンバー → ゴールド → 自動（この端末に記憶）
  themeOverride = MODES[(MODES.indexOf(chosenMode()) + 1) % MODES.length];
  try { localStorage.setItem(THEME_KEY, themeOverride); } catch (e) {}
  applyTheme(); fit(); toast("テンプレート：" + MODE_NAME[themeOverride]);
}
applyTheme();

/* ---------- 字体方案 ---------- */
var FONTS = {
  rounded: { css:"M+PLUS+Rounded+1c:wght@300;400;500",   fam:'"M PLUS Rounded 1c"',   wt:300, base:true },
  zen:     { css:"Zen+Kaku+Gothic+New:wght@300;400;500", fam:'"Zen Kaku Gothic New"', wt:300 },

function todaysEvents() {
  return state.events.filter(function (e) {
    if (!e.date) return true;
    var d = parseDate(e.date); return d && dayDiff(d) === 0;
  }).map(function (e) {
    var s = toMin(e.s), en = e.e ? toMin(e.e) : s + 60;
    return { s:s, e:en, title:e.title, who:e.who || "" };
  }).sort(function (a, b) { return a.s - b.s; });
}
function renderEvents() {
  var n = new Date(), now = n.getHours() * 60 + n.getMinutes();
  var all = todaysEvents(), MAX = 4;
  var upcoming = all.filter(function (e) { return e.e > now; });
  var past = all.filter(function (e) { return e.e <= now; });
  var show = upcoming.slice(0, MAX);
  if (show.length < MAX) show = past.slice(-(MAX - show.length)).concat(show);
  if (!show.length) { $("events").innerHTML = '<div class="empty">今日は予定がありません。ゆっくり休みましょう</div>'; return; }
  var nextS = null;
  for (var k = 0; k < all.length; k++) if (all[k].s > now) { nextS = all[k]; break; }
  $("events").innerHTML = show.map(function (e) {
    var isPast = e.e <= now, cur = e.s <= now && now < e.e, isNext = nextS === e;
    var cls = isPast ? "past" : cur ? "now" : isNext ? "next" : "", tag = "";
    if (cur) tag = '<span class="tag">進行中</span>';
    else if (isNext) { var d = e.s - now; tag = '<span class="tag">あと' + (d >= 60 ? Math.floor(d / 60) + "時間" + (d % 60 ? d % 60 + "分" : "") : d + "分") + '</span>'; }
    return '<div class="ev ' + cls + '"><span class="tm">' + fmtMin(e.s) + '</span><span class="ti">' + e.title +
           (e.who ? ' <span class="who">' + e.who + '</span>' : '') + '</span>' + (tag || "<span></span>") + '</div>';
  }).join("");
}

    return '<li><span class="what">' + r.what + '</span><span class="when">' + r.w.text + '</span></li>';
  }).join("") : '<li style="color:var(--ink-3)">リマインダーはありません</li>';
}

/* ---------- データ読み込み：data.json と Google スプレッドシート ---------- */
function parseCSV(t) {
  var rows = [], row = [], f = "", q = false, i, c;
  for (i = 0; i < t.length; i++) {
    c = t.charAt(i);
    if (q) { if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t.charAt(i + 1) === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.slice(1).filter(function (r) { return r.some(function (x) { return x.trim(); }); });
}
function getText(url) {
  return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (t) { if (/^\s*</.test(t)) throw 0; return t; });      // 未公開のシートはログイン画面(HTML)が返るので無視する
}
function loadData() {
  var srcs = [];
  function sheet(key, label, apply) {            // data.json で指定された CSV を読み、あれば内容を上書き
    return function () {
      var u = CONFIG.sheets[key]; if (!u) return;
      return getText(u).then(function (t) { apply(parseCSV(t)); srcs.push(label); }).catch(function () {});
    };
  }
  var p = getText(CONFIG.dataUrl).then(function (t) {
    var d = JSON.parse(t);
    if (d.events) state.events = d.events;
    if (d.todos) state.todos = d.todos.map(function (x) { return typeof x === "string" ? { t:x } : x; });
    if (d.reminders) state.reminders = d.reminders.map(function (x) { return { d:x.when || x.d, what:x.what }; });
    dataTheme = d.theme || null; applyTheme();
    if (d.sheets) for (var k in d.sheets) if (d.sheets[k]) CONFIG.sheets[k] = d.sheets[k];
    if (d.appVersion && d.appVersion !== APP_VERSION && !/[?&]v=/.test(location.search)) { location.replace(location.pathname + "?v=" + d.appVersion); return; }   // 新しい版が出たら自動更新
    state.quote = (d.quote && d.quote.t && d.quoteDate === todayStr()) ? [d.quote.t, d.quote.c || ""] : null;
    srcs.push("data.json");
  }).catch(function () {});
  p = p.then(sheet("events", "シート·予定", function (rows) {          // 列：日付,開始,終了,タイトル,誰
      state.events = rows.map(function (r) { return { date:r[0], s:r[1], e:r[2], title:r[3], who:r[4] }; }).filter(function (e) { return e.s && e.title; }); }))
   .then(sheet("todos", "シート·ToDo", function (rows) {               // 列：項目,完了
      state.todos = rows.map(function (r) { return { t:r[0], done:/^(y|yes|1|是|完成|完了|済|✓|true)$/i.test((r[1] || "").trim()) }; }).filter(function (x) { return x.t; }); }))
   .then(sheet("reminders", "シート·リマインダー", function (rows) {   // 列：日付,項目
      state.reminders = rows.map(function (r) { return { d:r[0], what:r[1] }; }).filter(function (x) { return x.what; }); }));
  return p.then(function () {
    state.src = srcs.length ? srcs.join(" / ") : "データなし";
    if (srcs.length) { var n = new Date(); state.updated = pad(n.getHours()) + ":" + pad(n.getMinutes()); }
    renderEvents(); renderTodo(); renderRem(); renderQuote(); renderFooter(); fit();
  });
}
function renderFooter() {
  $("ftL").textContent = CONFIG.city + " · 天気" + (weather.live ? "ライブ" : "サンプル") + " · v" + APP_VERSION;
  $("ftR").textContent = state.updated ? "データ " + state.updated + " 更新 · " + state.src : state.src;
}

/* ---------- 日本の祝日（国民の祝日に関する法律：固定日・ハッピーマンデー・春分/秋分・振替休日・国民の休日） ---------- */
var holCache = {};
function nthMon(y, m, k) { var d = new Date(y, m - 1, 1), off = (8 - d.getDay()) % 7; return 1 + off + (k - 1) * 7; }
function holidaysOf(y) {
  if (holCache[y]) return holCache[y];
  var H = {}, k = function (m, d) { return m * 100 + d; };
  var eq = function (a) { return Math.floor(a + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)); };
  H[k(1, 1)] = "元日"; H[k(1, nthMon(y, 1, 2))] = "成人の日"; H[k(2, 11)] = "建国記念の日";
  if (y >= 2020) H[k(2, 23)] = "天皇誕生日";
  H[k(3, eq(20.8431))] = "春分の日"; H[k(4, 29)] = "昭和の日"; H[k(5, 3)] = "憲法記念日";
  H[k(5, 4)] = "みどりの日"; H[k(5, 5)] = "こどもの日"; H[k(7, nthMon(y, 7, 3))] = "海の日";
  H[k(8, 11)] = "山の日"; H[k(9, nthMon(y, 9, 3))] = "敬老の日"; H[k(9, eq(23.2488))] = "秋分の日";
  H[k(10, nthMon(y, 10, 2))] = "スポーツの日"; H[k(11, 3)] = "文化の日"; H[k(11, 23)] = "勤労感謝の日";
  var keys = []; for (var x in H) keys.push(+x);
  keys.forEach(function (x) {                                   // 日曜の祝日 → 次の平日が振替休日
    var m = Math.floor(x / 100), d = x % 100;
    if (new Date(y, m - 1, d).getDay() !== 0) return;
    var t = new Date(y, m - 1, d + 1), c = k(t.getMonth() + 1, t.getDate());
    while (H[c]) { t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1); c = k(t.getMonth() + 1, t.getDate()); }
    H[c] = "振替休日";
  });
  for (var m = 1; m <= 12; m++) for (var d = 2; d < 31; d++) {  // 祝日に挟まれた平日 → 国民の休日
    var c = k(m, d), t = new Date(y, m - 1, d);
    if (t.getMonth() !== m - 1 || H[c] || t.getDay() === 0) continue;
    var pv = new Date(y, m - 1, d - 1), nx = new Date(y, m - 1, d + 1);
    if (H[k(pv.getMonth() + 1, pv.getDate())] && H[k(nx.getMonth() + 1, nx.getDate())]) H[c] = "国民の休日";
  }
  return (holCache[y] = H);
}
function holidayName(dt) { return holidaysOf(dt.getFullYear())[(dt.getMonth() + 1) * 100 + dt.getDate()] || ""; }
var TEST_TODAY = (location.search.match(/[?&]today=(\d{4})-(\d{1,2})-(\d{1,2})/) || null);   // 動作確認用 ?today=2026-9-21
function nowDate() { return TEST_TODAY ? new Date(+TEST_TODAY[1], +TEST_TODAY[2] - 1, +TEST_TODAY[3], new Date().getHours(), new Date().getMinutes(), new Date().getSeconds()) : new Date(); }

/* ---------- 時計 / 日付 / 一日メーター / 夜間減光 / 毎日3時に再読込 ---------- */
function tick() {
  var n = nowDate(), h = n.getHours();
  $("time").innerHTML = pad(h) + '<span class="colon' + (n.getSeconds() % 2 ? " off" : "") + '">:</span>' + pad(n.getMinutes());
  $("date").textContent = (n.getMonth() + 1) + "月" + n.getDate() + "日";
  $("wk").textContent = WK[n.getDay()];
  var hol = holidayName(n), row = $("date").parentNode, hcls = hol ? "date hol" : "date";
  if ($("hn").textContent !== hol) $("hn").textContent = hol;
  if (row.className !== hcls) { row.className = hcls; setTimeout(fit, 0); }              // 祝日名の有無で幅が変わるので再フィット
  var th = chosenTheme();
  if (document.documentElement.getAttribute("data-theme") !== th) { applyTheme(); setTimeout(fit, 0); }   // 6時/18時で自動切替
  $("greet").textContent = h < 5 ? "夜更けです" : h < 11 ? "おはよう" : h < 18 ? "こんにちは" : "こんばんは";
  $("dayfill").style.width = ((h * 60 + n.getMinutes()) / 14.4).toFixed(1) + "%";
  var night = !/[?&]dim=0/.test(location.search) && (h >= CONFIG.nightFrom || h < CONFIG.nightTo);
  $("dim").className = night ? "on" : "";
  if (h === 3 && n.getMinutes() === 0 && n.getSeconds() < 2) location.reload();
}

tick(); renderWeather(); renderEvents(); renderTodo(); renderRem(); renderQuote(); renderFooter();
loadData(); loadWeather();
setInterval(tick, 1000);
setInterval(function () { renderEvents(); renderTodo(); renderRem(); renderQuote(); renderWeather(); fit(); }, 60000);
setInterval(loadData, CONFIG.refreshMin * 60000);
setInterval(loadWeather, 30 * 60000);

/* ジェスチャ：時計を3回タップ＝テンプレート切替 / 日付を3回タップ＝下部の情報行の表示切替 */
function multiTap(el, n, fn) {
  var taps = [];
  el.addEventListener("click", function () {
    var t = new Date().getTime(); taps = taps.filter(function (x) { return t - x < 1000; }); taps.push(t);
    if (taps.length >= n) { taps = []; fn(); }
  });
}
multiTap($("time"), 3, cycleTheme);
multiTap($("date").parentNode, 3, function () { showInfo = !showInfo; fit(); });

try { addEventListener("click", function () { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); }); } catch (e) {}
